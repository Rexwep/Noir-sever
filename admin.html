<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>NOIR X11 — Admin</title>
<style>
:root{--bg:#070708;--s:#101012;--s2:#151517;--t:#f5f5f3;--m:#9b9b9d;--a:#d8ff62;--l:rgba(255,255,255,.12);--r:14px;--bad:#ff6b6b;--warn:#ffc857}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}[hidden]{display:none!important}
.logo{font-weight:800;letter-spacing:.04em}.logo span{color:var(--a)}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:var(--s);border:1px solid var(--l);border-radius:var(--r);padding:24px;width:min(100%,380px)}
.f{display:block;margin:0 0 14px}.f>span{display:block;color:var(--m);font-size:12px;margin-bottom:5px}
input[type=text],input[type=email],input[type=password],textarea{width:100%;background:var(--bg);border:1px solid var(--l);border-radius:10px;padding:10px 12px;outline:0}
input:focus,textarea:focus{border-color:var(--a)}textarea{resize:vertical}
.btn{background:transparent;border:1px solid var(--l);border-radius:999px;padding:8px 16px;cursor:pointer}.btn:hover{border-color:var(--a)}
.pri{background:var(--a);color:#080808;border-color:var(--a);font-weight:700}.pri:disabled,.btn:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--bad);min-height:20px;font-size:13px}
#app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{border-right:1px solid var(--l);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside .logo{padding:0 10px 16px}aside button{display:flex;justify-content:space-between;width:100%;text-align:left;background:0;border:0;border-radius:10px;padding:9px 10px;color:var(--m);cursor:pointer}
aside button.on,aside button:hover{background:var(--s2);color:var(--t)}aside i{width:8px;height:8px;border-radius:50%;background:var(--warn);align-self:center}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--l);position:sticky;top:0;background:rgba(7,7,8,.9);backdrop-filter:blur(10px);z-index:5;flex-wrap:wrap}
.pill{border:1px solid var(--l);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--m)}.pill.live{color:var(--a);border-color:var(--a)}.pill.warn{color:var(--warn);border-color:var(--warn)}
main{padding:24px;display:grid;gap:20px;align-content:start}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
h2{margin:0 0 4px;font-size:22px}.sub{color:var(--m);margin:0 0 16px}
.item{border:1px solid var(--l);border-radius:var(--r);padding:14px;margin-bottom:12px;background:var(--s)}
.item header{display:flex;gap:6px;align-items:center;margin-bottom:10px;color:var(--m);font-size:12px}.item header b{flex:1;color:var(--t)}
.mini{background:0;border:1px solid var(--l);border-radius:8px;padding:2px 9px;cursor:pointer}.mini:hover{border-color:var(--a)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
iframe{width:100%;height:78vh;border:1px solid var(--l);border-radius:var(--r);background:#000;position:sticky;top:70px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid var(--l);text-align:left}th{color:var(--m);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{background:var(--s);border:1px solid var(--l);border-radius:var(--r);padding:14px}.stat b{display:block;font-size:22px}.stat span{color:var(--m);font-size:12px}
@media(max-width:1100px){.split{grid-template-columns:1fr}iframe{display:none}}
@media(max-width:760px){#app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow-x:auto;border:0;border-bottom:1px solid var(--l);padding:8px}aside .logo{display:none}aside button{width:auto;white-space:nowrap;gap:8px}main,.top{padding:14px}}
</style></head><body>
<section id="login"><form class="card" id="lf"><div class="logo" style="font-size:22px;margin-bottom:4px">NOIR <span>X11</span></div><p class="sub">Administration</p>
<label class="f"><span>Password</span><input type="password" id="pw" autocomplete="current-password" required autofocus></label>
<label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rm"><span style="margin:0">Keep me signed in for 7 days</span></label>
<div class="err" id="le"></div><button class="btn pri" style="width:100%">Sign in</button></form></section>
<div id="app" hidden><aside><div class="logo">NOIR <span>X11</span></div><nav id="nav"></nav></aside>
<div><div class="top"><div class="bar"><span class="pill" id="st"></span><span class="pill" id="who"></span></div><div class="bar"><a class="btn" href="/" target="_blank" style="text-decoration:none">View site ↗</a><button class="btn" id="out">Log out</button></div></div><main id="main"></main></div></div>
<script>window.NOIR_ADMIN=true</script><script src="/cms.js"></script>
<script>
const {MOD,extract}=NOIR_CMS,$=s=>document.querySelector(s);
const el=(t,a={},...c)=>{const n=document.createElement(t);for(const k in a)k in n?n[k]=a[k]:n.setAttribute(k,a[k]);n.append(...c);return n};
let csrf,me,rows={},base={},cur='dash',work=null,saved='',tmr;
async function api(m,u,b){const r=await fetch('/api'+u,{method:m,credentials:'same-origin',headers:{'Content-Type':'application/json','x-csrf-token':csrf||''},body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&csrf)location.reload();throw new Error(j.error||'Request failed')}return j}
const fmt=t=>t?new Date(t.replace(' ','T')+(/Z|\+/.test(t)?'':'Z')).toLocaleString():'—';
async function boot(){try{const j=await api('GET','/auth/me');csrf=j.csrf;me=j.user;start()}catch{$('#login').hidden=false}}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';
 try{const j=await api('POST','/auth/login',{password:$('#pw').value,remember:$('#rm').checked});csrf=j.csrf;me=j.user;start()}catch(x){$('#le').textContent=x.message}};
$('#out').onclick=async()=>{await api('POST','/auth/logout').catch(()=>{});location.reload()};
async function start(){$('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=me.email+' · '+me.role;
 const h=await (await fetch('/')).text();base=extract(new DOMParser().parseFromString(h,'text/html'));await load();go('dash')}
async function load(){rows=(await api('GET','/admin/content')).modules;nav()}
function nav(){const n=$('#nav');n.replaceChildren();
 const add=(k,l)=>{const b=el('button',{onclick:()=>go(k)},l);if(k===cur)b.className='on';if(rows[k]&&rows[k].unpublished)b.append(el('i',{title:'Unpublished draft'}));n.append(b)};
 add('dash','Dashboard');for(const k in MOD)add(k,MOD[k].label);add('activity','Activity')}
function go(k){if(work&&JSON.stringify(work)!==saved&&!confirm('Discard unsaved changes?'))return;cur=k;work=null;nav();render()}
const dirty=()=>{status();clearTimeout(tmr);tmr=setTimeout(preview,250)};
function status(){const s=$('#st');if(!work){s.textContent='';s.className='pill';return}
 const r=rows[cur]||{},u=JSON.stringify(work)!==saved;
 if(u){s.textContent='Unsaved changes';s.className='pill warn'}
 else if(r.unpublished){s.textContent='Draft saved — not live';s.className='pill warn'}
 else if(r.published){s.textContent='Published · '+fmt(r.published_at);s.className='pill live'}
 else{s.textContent='Site default (not customised)';s.className='pill'}
 const p=$('#pub');if(p)p.disabled=u||!(r.unpublished);const d=$('#dis');if(d)d.disabled=u||!r.unpublished}
function field(f,o){const w=el('label',{className:'f'}),i=f.t==='b'?el('input',{type:'checkbox'}):f.t?el('textarea',{rows:f.t==='s'?5:3}):el('input',{type:'text'});
 if(f.t==='b'){i.checked=!!o[f.k];i.onchange=()=>{o[f.k]=i.checked;dirty()};w.style.cssText='display:flex;gap:8px;align-items:center';w.append(i,el('span',{style:'margin:0'},f.l));return w}
 i.value=f.t==='s'?(o[f.k]||[]).join('\n'):(o[f.k]||'');
 i.oninput=()=>{o[f.k]=f.t==='s'?i.value.split('\n').map(s=>s.trim()).filter(Boolean):i.value;dirty()};w.append(el('span',{},f.l),i);return w}
function form(){const M=MOD[cur],box=el('div');
 if(M.f)return M.f.forEach(f=>box.append(field(f,work))),box;
 const draw=()=>{box.replaceChildren();work.items.forEach((it,i)=>{
  const mv=(d)=>{const j=i+d;if(j<0||j>=work.items.length)return;[work.items[i],work.items[j]]=[work.items[j],work.items[i]];draw();dirty()};
  const h=el('header',{},el('b',{},'#'+(i+1)+' '+(it.name||it.title||it.label||it.value||'')),
   el('button',{className:'mini',type:'button',title:'Move up',onclick:()=>mv(-1)},'↑'),el('button',{className:'mini',type:'button',title:'Move down',onclick:()=>mv(1)},'↓'),
   el('button',{className:'mini',type:'button',title:'Duplicate',onclick:()=>{work.items.splice(i+1,0,JSON.parse(JSON.stringify(it)));draw();dirty()}},'⧉'),
   el('button',{className:'mini',type:'button',title:'Remove',onclick:()=>{if(work.items.length<2)return alert('At least one item is required.');if(confirm('Remove this item?')){work.items.splice(i,1);draw();dirty()}}},'✕'));
  const c=el('div',{className:'item'},h);M.list.forEach(f=>c.append(field(f,it)));box.append(c)});
  box.append(el('button',{className:'btn',type:'button',onclick:()=>{const n={};M.list.forEach(f=>n[f.k]=f.t==='s'?[]:f.t==='b'?false:'');work.items.push(n);draw();dirty()}},'+ Add item'))};
 draw();return box}
function render(){const m=$('#main');m.replaceChildren();status();
 if(cur==='dash')return dash(m);if(cur==='activity')return act(m);
 const r=rows[cur]||{};work=JSON.parse(JSON.stringify(r.draft||r.published||base[cur]));saved=JSON.stringify(work);status();
 const canW=me.role!=='VIEWER',canP=me.role==='OWNER';
 const save=el('button',{className:'btn',disabled:!canW,onclick:()=>doSave()},'Save draft'),
  pub=el('button',{id:'pub',className:'btn pri',disabled:!canP,onclick:async()=>{if(JSON.stringify(work)!==saved)await doSave(true);if(!confirm('Publish to the live website?'))return;await run(()=>api('POST','/admin/content/'+cur+'/publish'))}},'Publish'),
  dis=el('button',{id:'dis',className:'btn',onclick:async()=>{if(confirm('Discard the draft and return to the published version?'))await run(()=>api('POST','/admin/content/'+cur+'/discard'))}},'Discard draft');
 const left=el('div',{},el('h2',{},MOD[cur].label),el('p',{className:'sub'},'Editing a draft never changes the live site. Only Publish does.'),form(),el('div',{className:'bar',style:'margin-top:16px'},save,pub,dis),el('div',{id:'hist',style:'margin-top:28px'}));
 const fr=el('iframe',{src:'/',title:'Live preview',onload:preview});m.append(el('div',{className:'split'},left,fr));status();hist()}
async function doSave(quiet){if(!work)return;try{await api('PUT','/admin/content/'+cur,{data:work});await load();saved=JSON.stringify(work);status();if(!quiet)status()}catch(e){alert(e.message)}}
async function run(fn){try{await fn();await load();render()}catch(e){alert(e.message)}}
function preview(){const f=$('iframe');if(!f||!f.contentWindow||!work)return;const p={};for(const k in rows){const r=rows[k];if(r.draft||r.published)p[k]=r.draft||r.published}p[cur]=work;f.contentWindow.postMessage({noirPreview:p},location.origin)}
async function hist(){const h=$('#hist');if(!h)return;const {versions}=await api('GET','/admin/versions/'+cur);
 h.append(el('h2',{style:'font-size:16px'},'Version history'));if(!versions.length)return h.append(el('p',{className:'sub'},'No saved versions yet.'));
 const t=el('table',{},el('tr',{},el('th',{},'When'),el('th',{},'Action'),el('th',{},'By'),el('th')));
 versions.forEach(v=>t.append(el('tr',{},el('td',{},fmt(v.ts)),el('td',{},v.action),el('td',{},v.user_email),el('td',{},me.role==='VIEWER'?'':el('button',{className:'mini',onclick:async()=>{if(confirm('Load this version into the draft? (Live site is not changed until you publish.)'))await run(()=>api('POST','/admin/versions/'+v.id+'/restore'))}},'Restore')))));h.append(t)}
async function dash(m){const ks=Object.keys(MOD),pubd=ks.filter(k=>rows[k]&&rows[k].published),dr=ks.filter(k=>rows[k]&&rows[k].unpublished);
 const last=pubd.map(k=>rows[k].published_at).sort().pop(),{activity}=await api('GET','/admin/activity');
 const s=(v,l)=>el('div',{className:'stat'},el('b',{},v),el('span',{},l));
 m.append(el('h2',{},'Dashboard'),el('p',{className:'sub'},'Only real data is shown. Nothing here is estimated.'),
  el('div',{className:'grid'},s(pubd.length+' / '+ks.length,'Modules customised & live'),s(dr.length,'Modules with unpublished draft'),s(fmt(last),'Last published'),s(activity[0]?fmt(activity[0].ts):'—','Last admin activity')),
  el('p',{className:'sub'},'Not yet available: Leads, Analytics, Media Library, Backups. These are shown only when a real data source exists.'))}
async function act(m){const {activity}=await api('GET','/admin/activity');
 const t=el('table',{},el('tr',{},...['When','User','Action','Module','IP'].map(h=>el('th',{},h))));
 activity.forEach(a=>t.append(el('tr',{},...[fmt(a.ts),a.user_email,a.action,a.module||'',a.ip].map(x=>el('td',{},x||'')))));
 m.append(el('h2',{},'Activity log'),el('p',{className:'sub'},'Last 60 events. Logins, failed logins, saves, publishes and rollbacks.'),t)}
boot();
</script></body></html>
