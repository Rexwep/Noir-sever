<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NOIR X11 — Studio Admin</title>
<style>
:root{
  --bg:#070708; --surface:#101012; --surface-2:#151517;
  --text:#f5f5f3; --muted:#9b9b9d; --soft:#c4c4c6;
  --accent:#d8ff62; --accent-soft:rgba(216,255,98,.16);
  --glass:rgba(255,255,255,.04); --line:rgba(255,255,255,.12);
  --border-strong:rgba(255,255,255,.20); --glass-highlight:rgba(255,255,255,.08);
  --shadow:rgba(0,0,0,.4); --danger:#ff6b6b; --danger-soft:rgba(255,107,107,.14);
  --ok:#7fdb9a; --ok-soft:rgba(127,219,154,.14);
  --button-text:#080808; --radius:20px; --ease:cubic-bezier(.2,.75,.2,1);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.5;
}
::selection{background:var(--accent);color:var(--button-text)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
input,textarea{font:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Login screen ---------- */
#loginScreen{
  min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;
}
#loginScreen:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 78% 15%,rgba(155,124,255,.14),transparent 32%),
             radial-gradient(circle at 15% 85%,var(--accent-soft),transparent 32%);
}
.login-card{
  position:relative;z-index:1;width:100%;max-width:400px;
  background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:28px;padding:38px 34px;
  backdrop-filter:blur(20px);box-shadow:0 30px 80px var(--shadow);
}
.login-logo{font-weight:800;letter-spacing:-.06em;font-size:23px;margin-bottom:4px}
.login-logo span{color:var(--accent)}
.login-sub{color:var(--muted);font-size:13px;letter-spacing:.04em;margin-bottom:30px}
.field{margin-bottom:18px}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field input{
  width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);color:var(--text);font-size:14.5px;transition:border-color .25s var(--ease),background .25s var(--ease);
}
.field input:focus{outline:none;border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:rgba(255,255,255,.05)}
.btn{
  width:100%;padding:13px;border-radius:999px;border:0;background:var(--accent);color:var(--button-text);
  font-weight:750;font-size:14px;letter-spacing:.01em;transition:transform .3s var(--ease),opacity .2s;
}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-ghost{
  background:var(--glass);color:var(--text);border:1px solid var(--line);
}
.btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.08);transform:translateY(-2px)}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(255,107,107,.3)}
.btn-danger:hover:not(:disabled){background:rgba(255,107,107,.22);transform:translateY(-2px)}
.btn-sm{width:auto;padding:9px 16px;font-size:12.5px}
.alert{
  display:none;padding:11px 14px;border-radius:12px;font-size:13px;margin-bottom:18px;
  border:1px solid transparent;
}
.alert.show{display:block}
.alert-err{background:var(--danger-soft);color:var(--danger);border-color:rgba(255,107,107,.3)}
.alert-ok{background:var(--ok-soft);color:var(--ok);border-color:rgba(127,219,154,.3)}

/* ---------- App shell ---------- */
#appShell{display:none;min-height:100vh;grid-template-columns:250px 1fr}
#appShell.show{display:grid}
.sidebar{
  border-right:1px solid var(--line);background:var(--surface);
  padding:26px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{font-weight:800;letter-spacing:-.06em;font-size:19px;padding:0 8px 22px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand span{color:var(--accent)}
.brand small{display:block;font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:9.5px;color:var(--muted);margin-top:4px}
.nav-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 12px;border-radius:12px;color:var(--soft);font-size:13.5px;font-weight:600;
  margin-bottom:3px;transition:background .2s var(--ease),color .2s;border:1px solid transparent;
}
.nav-item:hover{background:var(--glass);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(216,255,98,.25)}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0;flex-shrink:0}
.nav-item.dirty .nav-dot{opacity:1}
.nav-section{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px}
.side-foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.who{font-size:12px;color:var(--muted);padding:0 12px 12px;word-break:break-all}

.main{padding:32px 40px 80px;max-width:980px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.topbar h1{font-size:clamp(26px,3vw,36px);letter-spacing:-.04em;margin:0}
.topbar p{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.unpub{color:var(--accent);border-color:rgba(216,255,98,.3);background:var(--accent-soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap}

.card{
  background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:20px;
}
.card h2{font-size:14px;letter-spacing:.04em;margin:0 0 18px;display:flex;align-items:center;gap:8px}
.card h2 .n{color:var(--accent);font-size:11px;letter-spacing:.15em}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid-2{grid-template-columns:1fr}#appShell.show{grid-template-columns:1fr}.sidebar{position:static;height:auto}.main{padding:24px 18px 60px}}

.f{margin-bottom:16px}
.f label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.f input,.f textarea{
  width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.025);color:var(--text);font-size:13.5px;resize:vertical;
  transition:border-color .2s,background .2s;
}
.f input:focus,.f textarea:focus{outline:none;border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:rgba(255,255,255,.045)}
.f-check{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--soft)}
.f-check input{width:auto}
.color-row{display:flex;gap:10px;align-items:center}
.color-row input[type=color]{width:44px;height:38px;padding:2px;border-radius:10px;border:1px solid var(--line);background:none;flex-shrink:0}
.color-row input[type=text]{flex:1}

.item-block{
  border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;
  background:rgba(255,255,255,.018);position:relative;
}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.item-tag{font-size:10.5px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;font-weight:700}
.icon-btn{
  width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);
  display:grid;place-items:center;font-size:15px;transition:.2s;
}
.icon-btn:hover{background:var(--danger-soft);color:var(--danger);border-color:rgba(255,107,107,.3)}
.add-item{
  width:100%;padding:13px;border:1px dashed var(--line);border-radius:14px;background:none;color:var(--muted);
  font-size:13px;font-weight:600;transition:.2s;
}
.add-item:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.tag-editor{display:flex;flex-wrap:wrap;gap:8px}
.tag-chip{display:flex;align-items:center;gap:7px;padding:7px 8px 7px 13px;background:var(--glass);border:1px solid var(--line);border-radius:999px;font-size:12px}
.tag-chip button{background:none;border:0;color:var(--muted);width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.tag-chip button:hover{color:var(--danger)}
.tag-add{display:flex;gap:8px;margin-top:10px}
.tag-add input{flex:1}

.footer-bar{
  position:sticky;bottom:0;margin-top:24px;padding:16px 20px;border-radius:18px;
  background:rgba(16,16,18,.85);backdrop-filter:blur(16px);border:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
}
.footer-bar .status{font-size:12px;color:var(--muted)}

.hist-list{list-style:none;margin:0;padding:0}
.hist-list li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--soft)}
.hist-list li:last-child{border-bottom:0}
.hist-list .act{color:var(--accent);font-weight:700;letter-spacing:.02em;font-size:11px}
.hist-list button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 11px;font-size:11px}
.hist-list button:hover{border-color:var(--accent);color:var(--accent)}

.toast{
  position:fixed;right:20px;bottom:20px;z-index:5000;padding:13px 18px;border-radius:14px;
  background:var(--surface-2);border:1px solid var(--line);font-size:13px;box-shadow:0 20px 50px var(--shadow);
  transform:translateY(140%);transition:transform .4s var(--ease);max-width:320px;
}
.toast.show{transform:translateY(0)}
.toast.err{border-color:rgba(255,107,107,.4);color:var(--danger)}
.toast.ok{border-color:rgba(127,219,154,.4);color:var(--ok)}

.loader{display:none;width:15px;height:15px;border-radius:50%;border:2px solid rgba(0,0,0,.25);border-top-color:var(--button-text);animation:spin .7s linear infinite}
.btn.loading .loader{display:inline-block}
.btn.loading .btn-label{opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 0}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">NOIR <span>X11</span></div>
    <div class="login-sub">STUDIO ADMIN · SIGN IN</div>
    <div class="alert alert-err" id="loginErr"></div>
    <form id="loginForm">
      <div class="field">
        <label for="pw">Password</label>
        <input type="password" id="pw" autocomplete="current-password" required autofocus>
      </div>
      <div class="field" style="display:flex;align-items:center;gap:9px;margin-bottom:24px">
        <input type="checkbox" id="remember" style="width:auto">
        <label for="remember" style="margin:0;text-transform:none;font-size:12.5px;letter-spacing:0;color:var(--soft)">Keep me signed in</label>
      </div>
      <button type="submit" class="btn" id="loginBtn"><span class="btn-label">Sign in</span> <span class="loader"></span></button>
    </form>
  </div>
</div>

<div id="appShell">
  <aside class="sidebar">
    <div class="brand">NOIR <span>X11</span><small>Studio Admin</small></div>
    <div class="nav-section">Content</div>
    <div id="navList"></div>
    <div class="nav-section">Studio</div>
    <div class="nav-item" data-view="activity"><span>Activity log</span></div>
    <div class="side-foot">
      <div class="who" id="whoAmI"></div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" style="width:100%">Log out</button>
    </div>
  </aside>

  <main class="main" id="mainArea">
    <!-- rendered by cms.js -->
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="/cms.js"></script>
</body>
</html>
